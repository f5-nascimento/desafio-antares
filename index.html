/* Redesign visual: premium editorial tech, sem aparência de protótipo genérico */
:root{--navy:#10172b;--navy2:#172440;--blue:#4f46e5;--cyan:#8de6df;--gold:#f6bd60;--ink:#141b2d;--muted:#65708a;--bg:#f7f8fc;--line:#e4e8f1;--radius:24px;--shadow:0 24px 70px rgba(20,27,45,.09)}
body{background:#f7f8fc;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.012em}
.shell{max-width:1240px;padding:24px clamp(16px,3.3vw,42px)}
.topbar{margin-bottom:24px;padding:4px 2px}
.brand{font-size:.98rem;letter-spacing:.08em;color:#121a2d}

.local-note .dot{box-shadow:0 0 0 4px #12b98118}

#homeView .hero:before{content:"";position:absolute;z-index:-1;width:420px;height:420px;right:27%;bottom:-340px;border-radius:50%;border:1px solid #4f46e515;box-shadow:0 0 0 38px #4f46e508,0 0 0 78px #4f46e505;pointer-events:none}

/* Tela inicial minimalista: personagem e conversa em primeiro plano */
body.home-mode{background:radial-gradient(ellipse at 50% 0%,#e7edff 0,transparent 46%),#f7f8fc;min-height:100svh}
.home-mode .shell{max-width:1040px;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,44px)}
.home-mode .topbar,.home-mode .footer{display:none}
.home-mode #homeView{width:100%}
.home-mode .hero{grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:clamp(20px,5vw,70px);align-items:center;min-height:min(650px,calc(100svh - 48px));padding:clamp(26px,6vw,72px);border-radius:36px;background:linear-gradient(145deg,#fff 0%,#f4f6ff 62%,#edf5ff 100%);color:var(--ink);border:1px solid #e4e8f5;box-shadow:0 30px 80px rgba(36,52,99,.12)}
.home-mode .hero:after{width:300px;height:300px;right:-160px;top:-170px;border-color:#5269e91b;box-shadow:0 0 0 38px #5269e90a,0 0 0 78px #5269e906}
.home-mode .intro-copy{position:relative;z-index:2;max-width:460px}
.home-mode .hero h1{font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.05;letter-spacing:-.055em;margin:0 0 18px;color:#121b32}
.home-mode .hero .eyebrow{color:#4f46e5;background:#eeefff;border:1px solid #dedfff;border-radius:999px;padding:9px 12px;font-size:.68rem;letter-spacing:.1em;margin-bottom:22px}
.home-mode .hero p{display:none}
.home-mode .field{margin:0 0 14px;gap:9px}
.home-mode .field label{font-size:.9rem;color:#34415b}
.home-mode .field input{min-height:54px;border:1px solid #d8deed;border-radius:16px;padding:15px 17px;font-size:1rem;box-shadow:0 4px 14px #17255408}
.home-mode .field input:focus{border-color:#7774f4;box-shadow:0 0 0 4px #6865ed1a}
.home-mode .hero-actions{margin-top:0;display:grid;grid-template-columns:1fr;gap:9px}
.home-mode .btn-primary{min-height:54px;border-radius:16px;background:#4f46e5;color:white;box-shadow:0 10px 22px #4f46e52c}
.home-mode .btn-ghost{background:white;color:#263452;border:1px solid #dce2ef}
.home-mode .home-message{margin-top:12px!important;color:#64708a!important;min-height:1.2em}
.home-mode .mascot-wrap{gap:14px}
.home-mode .mascot-card{width:min(100%,340px);background:linear-gradient(155deg,#192747,#263d6b);border:1px solid #ffffff40;border-radius:32px;padding:22px 22px 18px;box-shadow:0 24px 55px #14244c2b}
.home-mode .mascot-card:before{content:' ';display:block;position:absolute;inset:0;border-radius:32px;pointer-events:none}
.home-mode .mascot-card svg,.home-mode .mascot-card .eneas-portrait{max-height:340px;width:100%}
.home-mode .mascot-card h3{font-size:1.15rem;color:#fff;margin-top:10px}
.home-mode .mascot-card p{color:#dbe5ff}
.home-mode .speech{max-width:340px;width:100%;position:relative;margin-top:0;padding:17px 19px;border-radius:18px;font-size:.98rem;line-height:1.5;box-shadow:0 12px 30px #17255412;border:1px solid #e8ebf5}
.home-mode .speech:before{content:'';position:absolute;width:13px;height:13px;top:-7px;left:calc(50% - 7px);background:#fff;border-top:1px solid #e8ebf5;border-left:1px solid #e8ebf5;transform:rotate(45deg)}
@media(max-width:760px){.home-mode .shell{padding:14px;align-items:flex-start}.home-mode .hero{grid-template-columns:1fr;gap:20px;min-height:auto;padding:clamp(20px,6vw,32px);border-radius:26px}.home-mode .mascot-wrap{grid-row:1}.home-mode .mascot-card{width:min(100%,230px);padding:14px 16px 13px;border-radius:24px}.home-mode .mascot-card svg,.home-mode .mascot-card .eneas-portrait{max-height:245px}.home-mode .mascot-card p{font-size:.78rem}.home-mode .speech{max-width:100%;font-size:.92rem;padding:14px 16px}.home-mode .speech:before{left:calc(50% - 7px)}.home-mode .intro-copy{text-align:left}.home-mode .hero h1{font-size:clamp(1.9rem,8vw,2.6rem);margin-bottom:16px}.home-mode .hero .eyebrow{margin-bottom:17px}.home-mode .field input,.home-mode .btn-primary{min-height:52px}}
@media(max-width:380px){.home-mode .shell{padding:9px}.home-mode .hero{padding:18px;gap:16px}.home-mode .mascot-card svg,.home-mode .mascot-card .eneas-portrait{max-height:210px}.home-mode .hero h1{font-size:1.85rem}}

#homeView .eneas-portrait{position:relative;z-index:1}

@media(max-width:760px){.rh-intro{grid-template-columns:1fr;gap:0;border-radius:18px}.rh-eneas{align-items:flex-end;padding:8px 12px 0;min-height:124px}.rh-eneas img{width:94px;height:124px}.rh-dialog{padding:12px 14px 15px}.rh-dialog p{font-size:.9rem}.rh-scene{min-height:145px}.rh-scene img{min-height:145px;max-height:180px}.quiz-layout{grid-template-columns:minmax(0,1fr)}.side-panel{grid-row:auto}}

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'antaresRecruitmentV1';
  const TIME_LIMIT = 180000;
  const phaseNames = {1:'Trabalho em equipe',2:'Segurança do trabalho — informática',3:'Legislação autoral'};
  const phaseRooms = {1:'Sala de Recursos Humanos',2:'Laboratório de TI',3:'Departamento Jurídico'};
  const phaseDescriptions = {1:'Autonomia, ajustes interpessoais e relação com a liderança.',2:'Normas, ergonomia, prevenção de riscos e bem-estar na rotina de TI.',3:'Propriedade intelectual, licenças, proteção de dados e IA responsável.'};
  const $ = id => document.getElementById(id);
  const homeView = $('homeView'), quizView = $('quizView'), summaryView = $('summaryView'), finalView = $('finalView');
  let state = null, ticker = null, pendingAuto = null;
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const freshState = name => ({version:1,nome:name,faseAtual:1,questaoIndex:0,questionStartedAt:null,modo:'quiz',respostaSelecionada:null,feedbackAtual:null,run:{fase:1,respostas:[],acertos:0},resultados:{},tentativas:{1:[],2:[],3:[]},badges:[],updatedAt:Date.now()});
  function save(){ if(!state) return; state.updatedAt=Date.now(); try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){console.warn('Não foi possível salvar o progresso local.',e);} }
  function load(){ try{const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return null; const d=JSON.parse(raw); if(!d||d.version!==1||typeof d.nome!=='string'||![1,2,3].includes(d.faseAtual)||!Array.isArray(d.run?.respostas))return null; return d;}catch(e){return null;} }
  function stopTicker(){if(ticker){clearInterval(ticker);ticker=null;}}
  function showOnly(which){[homeView,quizView,summaryView,finalView].forEach(v=>v.classList.add('hidden'));which.classList.remove('hidden');document.body.classList.toggle('home-mode',which===homeView);window.scrollTo({top:0,behavior:'smooth'});}
  function init(){const saved=load();if(saved){state=saved;$('studentName').value=saved.nome;$('resumeBtn').classList.remove('hidden');$('resetBtn').classList.remove('hidden');$('homeMessage').textContent='Você tem um recrutamento em andamento.';}else{ $('resumeBtn').classList.add('hidden');$('resetBtn').classList.add('hidden');$('homeMessage').textContent='';}}
  function begin(){const name=$('studentName').value.trim();if(!name){$('studentName').focus();$('studentName').classList.add('shake');setTimeout(()=>$('studentName').classList.remove('shake'),400);return;}state=freshState(name);state.questionStartedAt=Date.now();save();renderQuestion();}
  function resume(){state=load();if(!state){alert('Não foi encontrado um progresso válido neste navegador.');init();return;}if(state.modo==='final'){renderFinal();return;}if(state.modo==='summary'){renderSummary();return;}if(state.modo==='quiz'){if(state.feedbackAtual){renderQuestion();return;}if(state.run.respostas.length>=20){renderSummary();return;}if(!state.questionStartedAt)state.questionStartedAt=Date.now();const left=state.questionStartedAt+TIME_LIMIT-Date.now();if(left<=0){timeExpired();return;}renderQuestion();}}
  function reset(){if(!confirm('Reiniciar apagará o progresso salvo deste recrutamento neste navegador. Deseja continuar?'))return;localStorage.removeItem(STORAGE_KEY);state=null;stopTicker();$('studentName').value='';init();showOnly(homeView);}
  function questionsForPhase(phase){return questoes.filter(q=>q.fase===phase);}
  function currentQuestion(){return questionsForPhase(state.faseAtual)[state.questaoIndex];}
  function timeRemaining(){return Math.max(0,TIME_LIMIT-(Date.now()-(state.questionStartedAt||Date.now())));}
  function fmt(ms){const total=Math.ceil(ms/1000);return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;}
  function progressHtml(){const done=state.run.respostas.length;const pct=(done/20)*100;return `<div class="progress-row"><span>Progresso da fase</span><span>${done} de 20 questões respondidas</span></div><div class="progress-track" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="20"><div class="progress-fill" style="width:${pct}%"></div></div>`;}
  function phaseListHtml(){return `<div class="phase-list">${[1,2,3].map(n=>{const passed=state.badges.includes(`fase${n}`),active=state.faseAtual===n;const unlocked=n<=state.faseAtual;return `<div class="phase-item ${active?'active':''} ${passed?'passed':''} ${!unlocked?'locked':''}"><div class="phase-number">${passed?'✓':String(n).padStart(2,'0')}</div><div><div class="phase-name">${phaseNames[n]}</div><div class="phase-status">${passed?'Fase aprovada':active?'Em andamento':unlocked?'Disponível':'Bloqueada até a aprovação'}</div></div></div>`}).join('')}</div>`;}
  function renderQuestion(){stopTicker();state.modo='quiz';const q=currentQuestion();if(!q){renderSummary();return;}if(!state.questionStartedAt)state.questionStartedAt=Date.now();save();const done=state.run.respostas.length;const letters=['A','B','C','D'];quizView.innerHTML=`${state.faseAtual===1?`<div class="rh-intro" id="rhIntro"><div class="rh-eneas"><img src="eneas-personagem.webp" alt="Instrutor Eneas com capacete, óculos de proteção e jaleco azul"><div class="rh-dialog"><div class="speaker">Instrutor Eneas</div><p id="eneasSpeech">Olá, ${escapeHtml(state.nome)}! Estamos na sala de Recursos Humanos. Vamos conversar sobre como uma boa equipe trabalha.</p><button class="rh-talk" type="button" id="eneasTalkBtn">Conversar com Eneas ↗</button></div></div><div class="rh-scene"><img src="sala-rh-antares.jpg" alt="Sala de Recursos Humanos da empresa Antares, com mesa de reunião e ambiente profissional"></div></div>`:''}<div class="section-head"><div><span class="tag">FASE ${state.faseAtual} DE 3</span><h2 style="margin-top:10px">${phaseNames[state.faseAtual]}</h2><p>${phaseRooms[state.faseAtual]} • ${phaseDescriptions[state.faseAtual]}</p></div></div><div class="quiz-layout"><div class="panel question-card"><div class="q-top"><span class="tag">QUESTÃO ${state.questaoIndex+1} / 20</span><div id="timer" class="timer"><span class="clock">◷</span><span id="timerText">03:00</span><span class="tiny">restantes</span></div></div><div style="margin-top:18px">${progressHtml()}</div><h2>${escapeHtml(q.enunciado)}</h2><div id="answers" class="answers">${q.alternativas.map((a,i)=>`<button class="answer" data-choice="${i}" type="button"><span class="letter">${letters[i]}</span><span>${escapeHtml(a.texto)}</span></button>`).join('')}</div><div class="question-footer"><span class="tiny muted">Escolha uma alternativa e confirme antes de o tempo acabar.</span><button id="confirmBtn" class="btn btn-blue" disabled>Confirmar resposta</button></div><div id="feedbackSlot"></div></div><aside class="side-panel"><div class="panel side-card"><h3>Etapas do recrutamento</h3>${phaseListHtml()}</div><div class="panel side-card"><h3>Seu painel</h3><div class="stats"><div class="stat"><b>${state.run.acertos}</b><span>Acertos nesta fase</span></div><div class="stat"><b>${state.run.respostas.length}</b><span>Respondidas</span></div></div><p class="tiny muted" style="margin:12px 0 0">A nota aparece ao final da fase. O temporizador continua contando se você recarregar a página.</p></div></aside></div>`;
    if(state.faseAtual===1){
      const talkLines=[
        `Olá, ${state.nome}! Estamos na sala de Recursos Humanos. Vamos conversar sobre como uma boa equipe trabalha.`,
        'Na Antares, autonomia também significa comunicar o andamento e pedir apoio quando necessário.',
        'Pense em situações reais de uma equipe de desenvolvimento. Escolha a alternativa mais profissional!'
      ];
      let talkIndex=0;
      const talkButton=$('eneasTalkBtn');
      if(talkButton)talkButton.addEventListener('click',()=>{
        talkIndex=(talkIndex+1)%talkLines.length;
        const speech=$('eneasSpeech');
        if(speech)speech.textContent=talkLines[talkIndex];
        talkButton.textContent=talkIndex===talkLines.length-1?'Ouvir novamente ↻':'Conversar com Eneas ↗';
      });
    }
    showOnly(quizView);
    let selected=state.respostaSelecionada;const answerBtns=[...quizView.querySelectorAll('[data-choice]')];
    if(state.feedbackAtual){const last=state.run.respostas[state.run.respostas.length-1];renderFeedback(q,last);return;}
    if(Number.isInteger(selected)&&selected>=0&&selected<4){answerBtns[selected].classList.add('selected');$('confirmBtn').disabled=false;}
    answerBtns.forEach(btn=>btn.addEventListener('click',()=>{if(state.feedbackAtual)return;state.respostaSelecionada=Number(btn.dataset.choice);answerBtns.forEach(b=>b.classList.toggle('selected',b===btn));$('confirmBtn').disabled=false;save();}));
    $('confirmBtn').addEventListener('click',confirmAnswer);
    ticker=setInterval(updateTimer,250);updateTimer();
  }
  function updateTimer(){if(!state||state.modo!=='quiz'||state.feedbackAtual)return;const left=timeRemaining();const text=$('timerText'),timer=$('timer');if(text)text.textContent=fmt(left);if(timer&&left<=30000)timer.classList.add('urgent');if(left<=0){stopTicker();timeExpired();}}
  function recordAnswer(index, timedOut=false){stopTicker();const q=currentQuestion();if(!q||state.feedbackAtual)return;const isCorrect=!timedOut&&index===q.respostaCorreta;const response={questaoId:q.id,escolha:timedOut?null:index,correta:isCorrect,tempoEsgotado:timedOut,respondidaEm:Date.now()};state.run.respostas.push(response);if(isCorrect)state.run.acertos++;state.feedbackAtual={isCorrect,timedOut,index};state.respostaSelecionada=null;save();renderFeedback(q,response);}
  function confirmAnswer(){if(!Number.isInteger(state.respostaSelecionada)||state.feedbackAtual)return;if(timeRemaining()<=0){timeExpired();return;}recordAnswer(state.respostaSelecionada,false);}
  function timeExpired(){if(!state||state.modo!=='quiz'||state.feedbackAtual)return;recordAnswer(null,true);}
  function renderFeedback(q,response){const letters=['A','B','C','D'];const all=[...quizView.querySelectorAll('[data-choice]')];all.forEach((b,i)=>{b.disabled=true;b.classList.remove('selected');if(i===q.respostaCorreta)b.classList.add('correct');else if(!response.correta&&i===response.escolha)b.classList.add('incorrect');});const correctText=q.alternativas[q.respostaCorreta].texto;const slot=$('feedbackSlot');slot.innerHTML=`<div class="feedback ${response.correta?'good':'bad'}"><h3>${response.tempoEsgotado?'⏰ Tempo esgotado!':response.correta?'✓ Boa! Resposta correta.':'↻ Ainda não, recruta!'}</h3><p>${response.tempoEsgotado?'Você não confirmou uma alternativa dentro dos 3 minutos. Esta questão foi registrada como incorreta.':response.correta?'Você identificou a conduta mais adequada para essa situação.':'A alternativa escolhida não é a melhor conduta nesta situação.'}</p><p><strong>Por quê?</strong> ${escapeHtml(q.explicacao)}</p>${!response.correta?`<p><strong>Resposta correta:</strong> ${letters[q.respostaCorreta]}) ${escapeHtml(correctText)}</p>`:''}<div style="margin-top:14px"><button id="nextBtn" class="btn btn-blue">${state.run.respostas.length>=20?'Ver resultado da fase':'Próxima questão →'}</button></div></div>`;if(response.tempoEsgotado){const h=slot.querySelector('h3');if(h)h.textContent='⏰ Tempo esgotado, recruta!';} $('nextBtn').addEventListener('click',nextQuestion);}
  function nextQuestion(){if(state.run.respostas.length>=20){renderSummary();return;}state.questaoIndex=state.run.respostas.length;state.questionStartedAt=Date.now();state.feedbackAtual=null;state.respostaSelecionada=null;save();renderQuestion();}
  function eneasReaction(score){if(score<70)return {title:'Vamos recalibrar, recruta!',text:'Respira, revise as situações e tente novamente. Evoluir faz parte do treinamento.',mood:'😤'};if(score<90)return {title:'Calma, muito calma!',text:'Você está chegando lá. Reforce alguns conceitos e tente novamente.',mood:'😅'};if(score<100)return {title:'Feroz! Sou teu fã!',text:'Meta alcançada! Você demonstrou preparo para avançar à próxima etapa.',mood:'😎'};return {title:'O KI dele é mais de 8 mil!',text:'Perfeição nesta fase! Eneas ativa o modo energia máxima. Missão impecável, recruta!',mood:'⚡'};}
  function renderSummary(){stopTicker();state.modo='summary';const phase=state.faseAtual;const correct=state.run.acertos;const score=Math.round(correct/20*100);const passed=correct>=18;const attempt={fase:phase,acertos:correct,erros:20-correct,nota:score,aprovado:passed,finalizadaEm:Date.now(),respostas:state.run.respostas.slice()};if(!state._attemptSaved){state.tentativas[phase]=state.tentativas[phase]||[];state.tentativas[phase].push(attempt);state.resultados[phase]=attempt;state._attemptSaved=true;}if(passed){if(!state.badges.includes(`fase${phase}`))state.badges.push(`fase${phase}`);if(score===100&&!state.badges.includes(`perfeita${phase}`))state.badges.push(`perfeita${phase}`);}save();const reaction=eneasReaction(score);const isLast=phase===3&&passed;summaryView.innerHTML=`<div class="result-hero"><span class="tag ${passed?'green':'red'}">${passed?'FASE CONCLUÍDA':'TREINAMENTO EM REVISÃO'}</span><h2>${escapeHtml(state.nome)}, ${reaction.title}</h2><p>${reaction.text}</p><div style="display:flex;align-items:center;gap:18px;margin-top:18px"><div style="font-size:3.2rem" class="${score===100?'glow':''}">${reaction.mood}</div><div><div style="font-size:2.5rem;font-weight:950;letter-spacing:-.05em">${score}%</div><div style="color:#d5e4f6">${correct} acertos de 20 questões</div></div></div></div><div class="panel"><div class="section-head"><div><h2>Resultado da fase ${phase}</h2><p>${phaseNames[phase]} • ${phaseRooms[phase]}</p></div><span class="tag ${passed?'green':'red'}">${passed?'APROVADO':'AINDA NÃO APROVADO'}</span></div><div class="score-grid"><div class="score-card"><h3>Acertos</h3><div class="score-big">${correct}/20</div><div class="tiny muted">${correct} respostas corretas</div></div><div class="score-card"><h3>Erros</h3><div class="score-big">${20-correct}/20</div><div class="tiny muted">Inclui questões sem resposta no prazo</div></div><div class="score-card"><h3>Critério de avanço</h3><div class="score-big">${passed?'✓':'18/20'}</div><div class="tiny muted">Mínimo de 90% para avançar</div></div></div><div class="callout" style="margin-top:18px">${passed?`Você cumpriu o requisito de aprovação desta fase. ${score===100?'Conquista perfeita desbloqueada!':'A badge da fase foi adicionada ao seu perfil.'}`:`Para avançar, você precisa de pelo menos 18 acertos. Esta fase deve ser refeita; sua próxima tentativa começa novamente na questão 1.`}</div><div class="badge-row">${state.badges.filter(b=>b.endsWith(String(phase))||b===`fase${phase}`).map(b=>`<div class="badge-item"><span class="medal">${b.startsWith('perfeita')?'🏆':'🏅'}</span>${b.startsWith('perfeita')?'100% — Desempenho perfeito':`Fase ${phase} aprovada`}</div>`).join('')}</div><div class="hero-actions" style="margin-top:20px">${passed?(isLast?'<button id="finalBtn" class="btn btn-primary">Ver resultado final →</button>':`<button id="advanceBtn" class="btn btn-blue">Avançar para a fase ${phase+1} →</button>`):'<button id="retryBtn" class="btn btn-blue">Tentar esta fase novamente ↻</button>'}<button id="homeReturnBtn" class="btn btn-outline">Salvar e sair</button></div></div>`;showOnly(summaryView);$('homeReturnBtn').addEventListener('click',()=>{save();stopTicker();init();showOnly(homeView);});if(passed&&isLast)$('finalBtn').addEventListener('click',renderFinal);else if(passed)$('advanceBtn').addEventListener('click',advancePhase);else $('retryBtn').addEventListener('click',retryPhase);}
  function advancePhase(){const next=state.faseAtual+1;if(next>3){renderFinal();return;}state.faseAtual=next;state.questaoIndex=0;state.run={fase:next,respostas:[],acertos:0};state.questionStartedAt=Date.now();state.feedbackAtual=null;state.respostaSelecionada=null;state._attemptSaved=false;state.modo='quiz';save();renderQuestion();}
  function retryPhase(){state.run={fase:state.faseAtual,respostas:[],acertos:0};state.questaoIndex=0;state.questionStartedAt=Date.now();state.feedbackAtual=null;state.respostaSelecionada=null;state._attemptSaved=false;state.modo='quiz';save();renderQuestion();}
  function renderFinal(){stopTicker();state.modo='final';save();const results=[1,2,3].map(n=>state.resultados[n]).filter(Boolean);const totalCorrect=results.reduce((s,r)=>s+r.acertos,0);const totalAnswered=results.length*20;const overall=totalAnswered?Math.round(totalCorrect/60*100):0;const badgeLabels=state.badges.map(b=>{if(b.startsWith('perfeita'))return `🏆 Fase ${b.slice(-1)} — 100%`;return `🏅 Fase ${b.slice(-1)} aprovada`;});finalView.innerHTML=`<div class="result-hero"><span class="eyebrow">✦ PROCESSO SELETIVO CONCLUÍDO</span><h2>Parabéns, ${escapeHtml(state.nome)}!</h2><p>Você chegou ao fim da jornada de recrutamento da Antares. Confira seu desempenho e as conquistas obtidas.</p><div style="display:flex;align-items:center;gap:18px;margin-top:16px"><div style="font-size:3rem">🎉</div><div><div style="font-size:2.7rem;font-weight:950">${overall}%</div><div style="color:#d5e4f6">Nota geral • ${totalCorrect} acertos em 60 questões</div></div></div></div><div class="panel"><div class="section-head"><div><h2>Seu relatório de recrutamento</h2><p>Resultado por fase, com base na tentativa registrada mais recente de cada fase.</p></div><span class="tag green">3 FASES CONCLUÍDAS</span></div><div class="score-grid">${[1,2,3].map(n=>{const r=state.resultados[n]||{acertos:0,nota:0,aprovado:false};return `<div class="score-card"><h3>${n}. ${phaseNames[n]}</h3><div class="score-big">${r.nota}%</div><div class="tiny muted">${r.acertos}/20 acertos</div><div style="margin-top:12px"><span class="tag ${r.aprovado?'green':'red'}">${r.aprovado?'Aprovado':'Não aprovado'}</span></div></div>`}).join('')}</div><h3 style="margin:24px 0 8px">Conquistas desbloqueadas</h3><div class="badge-row">${badgeLabels.length?badgeLabels.map(b=>`<div class="badge-item"><span class="medal">${b.split(' ')[0]}</span>${escapeHtml(b.slice(2))}</div>`).join(''):'<span class="muted">Nenhuma badge registrada.</span>'}</div><div class="callout"><strong>Como a nota geral é calculada:</strong> soma dos acertos registrados nas três fases dividida por 60 e multiplicada por 100. Cada fase tem o mesmo peso. O histórico das tentativas fica salvo neste navegador.</div><div class="hero-actions" style="margin-top:22px"><button id="downloadBtn" class="btn btn-blue">Baixar relatório JSON ↓</button><button id="printBtn" class="btn btn-outline">Imprimir / salvar em PDF</button><button id="backHomeBtn" class="btn btn-outline">Voltar ao início</button></div><p class="tiny muted" style="margin-top:16px">Este relatório é gerado localmente e não é enviado automaticamente ao professor ou à Antares.</p></div>`;showOnly(finalView);$('downloadBtn').addEventListener('click',downloadReport);$('printBtn').addEventListener('click',()=>window.print());$('backHomeBtn').addEventListener('click',()=>{init();showOnly(homeView);});}
  function downloadReport(){const report={titulo:'Relatório de recrutamento — Antares',aluno:state.nome,geradoEm:new Date().toISOString(),notaGeral:Math.round([1,2,3].reduce((sum,n)=>sum+(state.resultados[n]?.acertos||0),0)/60*100),resultadosPorFase:[1,2,3].map(n=>({fase:n,nome:phaseNames[n],...(state.resultados[n]||{}),tentativas:state.tentativas[n]||[]})),badges:state.badges,observacao:'Relatório educacional gerado localmente. Não substitui avaliação institucional.'};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`relatorio-antares-${state.nome.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'aluno'}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
  $('startBtn').addEventListener('click',begin);$('resumeBtn').addEventListener('click',resume);$('resetBtn').addEventListener('click',reset);$('studentName').addEventListener('keydown',e=>{if(e.key==='Enter')begin();});
  init();
})();
</script>
